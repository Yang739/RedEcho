<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RedEcho · 首页设计稿</title>
<style>
  :root{
    --red:#C8161D; --red-deep:#b3000b; --gold:#E8A33D;
    --gray:#999999; --bg:#f5f5f5; --ink:#1a1a1a; --card:#fff; --line:#ececec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;
    background:#eceef1; color:var(--ink); display:flex; justify-content:center; padding:40px 16px 64px;
  }
  .phone{
    width:360px; height:760px; background:#fff; border:10px solid #1c1c1e; border-radius:48px;
    box-shadow:0 24px 60px rgba(0,0,0,.18); overflow:hidden; display:flex; flex-direction:column;
  }
  .statusbar{height:30px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:12px; color:#444; font-weight:600;}
  .appbar{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line);}
  .appbar .brand{font-size:19px; font-weight:800; color:var(--red-deep); letter-spacing:.5px;}
  .appbar .brand small{font-size:11px; font-weight:600; color:var(--gold); margin-left:6px; letter-spacing:1px;}
  .appbar .right{display:flex; align-items:center; gap:12px;}
  .icon-btn{width:34px; height:34px; border-radius:50%; background:#f3f3f3; display:flex; align-items:center; justify-content:center; color:#555; cursor:pointer;}
  .icon-btn:active{transform:scale(.92);}
  .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(160deg,#E23B3F,#9E0B12); display:flex; align-items:center; justify-content:center;}
  .avatar svg{width:18px; height:18px;}

  .content{flex:1; overflow-y:auto; background:var(--bg); padding:16px; display:flex; flex-direction:column; gap:18px;}
  .content::-webkit-scrollbar{width:0;}

  /* 直播 banner */
  .live-banner{
    position:relative; border-radius:18px; padding:18px 18px 16px; overflow:hidden;
    background:linear-gradient(135deg,#E23B3F 0%,#C8161D 55%,#9E0B12 100%);
    color:#fff; box-shadow:0 10px 26px rgba(200,22,29,.28);
  }
  .live-banner .glow{position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle,rgba(232,163,61,.45),transparent 70%);}
  .live-badge{display:inline-flex; align-items:center; gap:6px; background:var(--gold); color:#5a3a00; font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; letter-spacing:.5px;}
  .live-badge .dot{width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.35; transform:scale(.7);}}
  .live-title{margin:12px 0 4px; font-size:18px; font-weight:800;}
  .live-sub{font-size:12.5px; opacity:.9;}
  .enter-btn{margin-top:14px; align-self:flex-start; background:#fff; color:var(--red-deep); font-weight:700; font-size:13px; padding:9px 22px; border-radius:999px; cursor:pointer; border:none; transition:transform .14s;}
  .enter-btn:active{transform:scale(.94);}

  .sec-title{font-size:15px; font-weight:800; color:var(--ink); margin:2px 2px -4px; display:flex; align-items:center; justify-content:space-between;}
  .sec-title .more{font-size:12px; color:var(--gray); font-weight:600;}

  .hscroll{display:flex; gap:12px; overflow-x:auto; padding:2px; scroll-snap-type:x mandatory;}
  .hscroll::-webkit-scrollbar{height:0;}
  .show-card{flex:0 0 200px; scroll-snap-align:start; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; transition:transform .14s, box-shadow .2s;}
  .show-card:active{transform:scale(.97);}
  .show-card .thumb{height:118px; position:relative; display:flex; align-items:flex-end; padding:10px;}
  .show-card .thumb.t1{background:linear-gradient(135deg,#C8161D,#7d0a0f);}
  .show-card .thumb.t2{background:linear-gradient(135deg,#E8A33D,#b9791f);}
  .show-card .thumb.t3{background:linear-gradient(135deg,#3a6ea5,#1f3f63);}
  .thumb .chip{background:rgba(255,255,255,.92); color:var(--red-deep); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;}
  .show-card .body{padding:11px 12px 13px;}
  .show-card .title{font-size:14px; font-weight:700; line-height:1.3;}
  .show-card .tags{display:flex; gap:6px; margin:7px 0 8px;}
  .show-card .tag{font-size:10px; color:var(--red); background:rgba(200,22,29,.08); padding:2px 7px; border-radius:6px; font-weight:600;}
  .show-card .meta{font-size:11px; color:var(--gray);}

  .points-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px;}
  .points-card .row{display:flex; align-items:center; justify-content:space-between;}
  .points-card .pl{font-size:13px; color:#555; font-weight:600;}
  .points-card .pv{font-size:24px; font-weight:800; color:var(--red-deep);}
  .points-card .pv span{font-size:12px; color:var(--gray); font-weight:600; margin-left:4px;}
  .bar{height:8px; border-radius:999px; background:#f0f0f0; overflow:hidden;}
  .bar>i{display:block; height:100%; width:64%; background:linear-gradient(90deg,var(--gold),#f0c074); border-radius:999px;}
  .points-card .sub{font-size:11.5px; color:var(--gray);}
  .points-card .earn{margin-top:2px; align-self:flex-start; background:rgba(232,163,61,.12); color:#9a6a12; font-weight:700; font-size:12.5px; padding:8px 16px; border-radius:999px; border:1px solid rgba(232,163,61,.4); cursor:pointer;}
  .points-card .earn:active{transform:scale(.95);}
  .hint{text-align:center; color:#9aa0a6; font-size:11.5px; padding:4px 0 2px;}

  /* 导航栏（与 navbar.html 一致） */
  .navbar-wrap{padding:12px 16px 22px; background:#fff;}
  .navbar{display:flex; background:#fff; border:1px solid var(--line); border-radius:28px; padding:6px; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:18px; cursor:pointer; color:var(--gray); background:transparent; position:relative; overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent; transition:transform .14s ease, background-color .18s ease, color .18s ease;}
  .tab svg{width:23px; height:23px; display:block;}
  .tab .label{font-size:11px; font-weight:600; letter-spacing:.3px;}
  .tab.active{background:var(--red); color:#fff;}
  .tab.pressing{transform:scale(.9);}
  .ripple{position:absolute; border-radius:50%; background:rgba(200,22,29,.16); transform:scale(0); animation:ripple .6s ease-out forwards; pointer-events:none;}
  .tab.active .ripple{background:rgba(255,255,255,.5);}
  @keyframes ripple{to{transform:scale(2.6); opacity:0;}}
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>●●● 100%</span></div>
    <div class="appbar">
      <div class="brand">红色回响<small>REDECHO</small></div>
      <div class="right">
        <div class="icon-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </div>
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="#F6C95E"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.1 1-5.8L3.5 9.2l5.9-.9z"/></svg>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- 直播演出入口 -->
      <div class="live-banner">
        <div class="glow"></div>
        <span class="live-badge"><span class="dot"></span>LIVE 正在直播</span>
        <div class="live-title">《延安保育院》</div>
        <div class="live-sub">沉浸式互动演出 · 实时投票 / 情绪反馈中</div>
        <button class="enter-btn">进入房间 →</button>
      </div>

      <!-- 推荐卡片流 -->
      <div class="sec-title">为你推荐 <span class="more">查看全部 ›</span></div>
      <div class="hscroll">
        <div class="show-card">
          <div class="thumb t1"><span class="chip">今夜首演</span></div>
          <div class="body"><div class="title">《红岩》沉浸式演出</div><div class="tags"><span class="tag">革命</span><span class="tag">沉浸</span></div><div class="meta">19:30 · 已报名 1.2k</div></div>
        </div>
        <div class="show-card">
          <div class="thumb t2"><span class="chip">红色经典</span></div>
          <div class="body"><div class="title">《长征组歌》音乐史诗</div><div class="tags"><span class="tag">合唱</span><span class="tag">史诗</span></div><div class="meta">明晚 20:00 · 已报名 860</div></div>
        </div>
        <div class="show-card">
          <div class="thumb t3"><span class="chip">互动剧场</span></div>
          <div class="body"><div class="title">《青春之歌》剧本演读</div><div class="tags"><span class="tag">演读</span><span class="tag">参与</span></div><div class="meta">周六 14:00 · 名额 40</div></div>
        </div>
      </div>

      <!-- 积分概览 -->
      <div class="sec-title">积分概览</div>
      <div class="points-card">
        <div class="row"><span class="pl">我的积分</span><span class="pv">320<span>分</span></span></div>
        <div class="bar"><i></i></div>
        <span class="sub">距下一等级（红星会员）还差 180 积分</span>
        <button class="earn">去赚积分 →</button>
      </div>

      <div class="hint">↑ 上滑浏览 · 点击下方导航切换 Tab</div>
    </div>

    <div class="navbar-wrap"><div id="navbar"></div></div>
  </div>

<script>
  const ICONS={
    home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>`,
    show:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4Z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>`,
    create:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16l-1 4Z"/><path d="M14 6l3 3"/></svg>`,
    mine:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>`
  };
  const TABS=[{k:'home',l:'首页'},{k:'show',l:'演出'},{k:'create',l:'创作'},{k:'mine',l:'我的'}];
  function attach(tab){
    tab.addEventListener('pointerdown',e=>{
      tab.classList.add('pressing');
      const r=tab.getBoundingClientRect(), size=Math.max(r.width,r.height);
      const rp=document.createElement('span'); rp.className='ripple';
      rp.style.width=rp.style.height=size+'px';
      rp.style.left=(e.clientX-r.left-size/2)+'px'; rp.style.top=(e.clientY-r.top-size/2)+'px';
      tab.appendChild(rp); setTimeout(()=>rp.remove(),600);
    });
    ['pointerup','pointerleave'].forEach(ev=>tab.addEventListener(ev,()=>tab.classList.remove('pressing')));
    tab.addEventListener('click',()=>{ tab.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); });
  }
  const bar=document.getElementById('navbar'); bar.className='navbar';
  TABS.forEach(t=>{ const el=document.createElement('div'); el.className='tab'+(t.k==='home'?' active':''); el.innerHTML=ICONS[t.k]+`<span class="label">${t.l}</span>`; attach(el); bar.appendChild(el); });
</script>
</body>
</html>
